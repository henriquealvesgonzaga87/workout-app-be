[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[project]
name = "workout-app-be"
version = "0.1.0"
description = "workout-app-be dependencies"
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi (>=0.135.2,<0.136.0)",
    "uvicorn (>=0.42.0,<0.43.0)",
    "pydantic[email] (>=2.12.5,<3.0.0)",
    "sqlalchemy (>=2.0.48,<3.0.0)",
    "pydantic-settings (>=2.13.1,<3.0.0)",
    "pytest (>=9.0.2,<10.0.0)",
    "dependency-injector (>=4.49.0,<5.0.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "passlib (>=1.7.4,<2.0.0)",
    "types-passlib (>=1.7.7.20260211,<2.0.0.0)",
    "argon2-cffi (>=25.1.0,<26.0.0)",
    "coverage (>=7.13.5,<8.0.0)",
    "ruff (>=0.15.8,<0.16.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
]

[dependency-groups]
dev = [
    "ruff (>=0.15.7,<0.16.0)"
]

[tool.ruff]
# Strict PEP 8 line length limit
line-length = 119

# Target Python version
target-version = "py310"

# Files to include/exclude
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
# Rule selection:
# E/W: pycodestyle (PEP 8 style rules)
# F: Pyflakes (detects unused imports and logic errors)
# I: isort (import sorting and organization)
# B: flake8-bugbear (common design flaws)
select = ["E", "W", "F", "I", "B"]

# Allow Ruff to automatically fix these rules
fixable = ["ALL"]
unfixable = []

# Disable specific rules if they conflict with your workflow
ignore = [
    "B008",
    "B017",
    "B904",
    "E721",
    "E722",
    "W291",
]

[tool.ruff.lint.isort]
# Sort imports alphabetically and in blocks
# 1. Standard Library | 2. Third-party | 3. First-party (Your App)
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
combine-as-imports = true
split-on-trailing-comma = true

# CRITICAL: Replace "my_app" with your actual project folder name
# This tells Ruff which imports belong to your application
known-first-party = ["app", "src"]

[tool.ruff.format]
# Aesthetic formatting (replaces Black)
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
# Replace "app" and "utils" with your actual source folders
source = ["app", "utils"]

[tool.coverage.report]
# Shows which lines are missing coverage in the terminal
show_missing = true
# Exclude folders that don't need testing
omit = [
    "tests/*",
    ".venv/*",
    "*/__init__.py",
]
